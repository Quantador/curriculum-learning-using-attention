# SuperGLUE AX-b (broad-coverage diagnostic), part of OPUS's Table 5 OOD suite.
#
# lm-eval-harness 0.4.12 registers no AX-b task at all (`lm_eval/tasks/super_glue/`
# has no axb directory, and nothing matching resembles it in TaskManager().all_tasks),
# so the name in OOD_TASKS resolved to a KeyError and scored nan. The underlying data
# is available and, importantly, LABELLED: `aps/super_glue` config axb has a 1104-row
# test split whose `label` is a real ClassLabel(entailment/not_entailment), not the
# hidden -1 placeholder some leaderboard diagnostic splits ship with -- so it can be
# scored locally.
#
# Prompt/choice format mirrors lm-eval's own super_glue/rte/default.yaml, the closest
# registered task: binary entailment scored as True/False by log-likelihood. AX-b
# names its fields sentence1/sentence2 where RTE uses premise/hypothesis; the label
# encoding is the same (0 = entailment -> 'True', 1 = not_entailment -> 'False'), so
# doc_to_choice keeps RTE's ordering.
#
# AX-b is diagnostic-only: it has a test split and no train/validation, hence
# test_split with no fewshot source. run_eval_suite evaluates it zero-shot anyway
# (num_fewshot=0 for every non-BBH task), matching OPUS.
task: super_glue_axb
dataset_path: aps/super_glue
dataset_name: axb
output_type: multiple_choice
test_split: test
doc_to_text: "{{sentence1}}\nQuestion: {{sentence2}} True or False?\nAnswer:"
doc_to_target: label
doc_to_choice: ['True', 'False']
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
